<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ronnie's MP3 Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="player-shell">
    <header class="player-header">
      <h1>🎵 Ronnie's MP3 Player</h1>
    </header>

    <!-- Import Section -->
    <section class="import-section">
      <h2>Import Music</h2>

      <!-- Drag-and-drop / paste zone -->
      <div class="drop-zone" id="dropZone" tabindex="0"
           aria-label="Drag and drop a music folder here, or press Ctrl+V to paste a folder path">
        <span class="drop-icon">📂</span>
        <p class="drop-primary">Drag &amp; drop a folder here</p>
        <p class="drop-secondary">or press <kbd>Ctrl</kbd>+<kbd>V</kbd> to paste a folder path</p>
      </div>

      <!-- Explicit buttons -->
      <div class="import-actions">
        <label class="btn btn-primary" for="folderInput">
          📁 Choose Folder
          <input type="file" id="folderInput" accept="audio/*"
                 webkitdirectory multiple hidden />
        </label>

        <label class="btn btn-secondary" for="filesInput">
          🎵 Choose Files
          <input type="file" id="filesInput" accept="audio/*" multiple hidden />
        </label>

        <button class="btn btn-outline" id="pasteBtn" title="Paste folder path from clipboard">
          📋 Paste Path
        </button>
      </div>

      <!-- Clipboard path input (shown on paste) -->
      <div class="clipboard-row" id="clipboardRow" hidden>
        <input type="text" id="clipboardPath" class="clipboard-input"
               placeholder="Paste a folder path here and press Enter" />
        <button class="btn btn-primary" id="clipboardGo">Go</button>
      </div>

      <p class="import-note" id="importNote"></p>
    </section>

    <!-- Now Playing -->
    <section class="now-playing" id="nowPlaying">
      <div class="track-info">
        <span class="track-title" id="trackTitle">No track selected</span>
        <span class="track-index" id="trackIndex"></span>
      </div>

      <!-- Progress bar -->
      <div class="progress-bar-wrap">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-bar"
               min="0" max="100" value="0" step="0.1"
               aria-label="Playback position" />
        <span class="time" id="duration">0:00</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle" aria-pressed="false">🔀</button>
        <button class="ctrl-btn" id="prevBtn" title="Previous">⏮</button>
        <button class="ctrl-btn ctrl-play" id="playBtn" title="Play / Pause">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="Next">⏭</button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat" aria-pressed="false">🔁</button>
      </div>

      <!-- Volume -->
      <div class="volume-row">
        <span>🔈</span>
        <input type="range" id="volumeBar" class="volume-bar"
               min="0" max="1" step="0.01" value="1"
               aria-label="Volume" />
        <span>🔊</span>
      </div>
    </section>

    <!-- Playlist -->
    <section class="playlist-section">
      <div class="playlist-header">
        <h2>Playlist <span id="playlistCount"></span></h2>
        <button class="btn btn-outline btn-sm" id="clearBtn">Clear</button>
      </div>
      <ul class="playlist" id="playlist" role="listbox" aria-label="Playlist">
        <li class="playlist-empty">No tracks loaded — import a folder to get started.</li>
      </ul>
    </section>
  </div>

  <audio id="audio"></audio>
  <script src="app.js"></script>
</body>
</html>
